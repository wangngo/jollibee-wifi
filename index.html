<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jollibee Free WiFi</title>
<style>
  :root { --jb-red:#c8102e; --jb-gold:#fdb827; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
    margin: 0; min-height: 100vh;
    background: linear-gradient(180deg, var(--jb-red) 0%, #8f0b20 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .wrap { max-width: 380px; width: 100%; }
  .logo-block { text-align: center; margin-bottom: 18px; }
  .logo { height: 72px; display: block; margin: 0 auto; }
  .logo-text {
    font-size: 30px; font-weight: 900; color: #fff;
    font-style: italic; letter-spacing: .01em;
    margin-top: -10px; margin-left: 38px;
    text-shadow: 1px 1px 0 rgba(0,0,0,.15);
  }
  .card {
    background: #fff; color: #222; border-radius: 18px;
    padding: 28px 24px; width: 100%;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
    text-align: center;
  }
  h1 { font-size: 22px; margin: 0 0 8px; color: var(--jb-red); }
  p { font-size: 14px; line-height: 1.6; color: #555; margin: 0 0 6px; }
  .timer {
    font-size: 13px; color: #7a1a00; background: #fff6e0;
    border: 1px solid var(--jb-gold); border-radius: 10px;
    padding: 10px 12px; margin: 16px 0;
  }
  button {
    margin-top: 10px; padding: 15px; width: 100%; font-size: 17px;
    background: var(--jb-red); color: #fff; border: none; border-radius: 10px;
    font-weight: 700; cursor: pointer;
  }
  button:active { background: #8f0b20; }
  .err { color: var(--jb-red); font-size: 13px; margin-top: 10px; }
  .fine { font-size: 11px; color: #aaa; margin-top: 16px; }
</style>
</head>
<body>
<div class="wrap">
<div class="logo-block">
  <img class="logo" src="logo.png" alt="Jollibee">
</div>
<div class="card">
  <h1>Chào bạn! WiFi miễn phí đây</h1>
  <p>Bấm "Đồng ý & Kết nối" để vào mạng ngay — không cần mật khẩu.</p>
  <div class="timer">⏱ Mỗi lượt kết nối kéo dài <strong>2 phút</strong>, sau đó tự ngắt để nhường WiFi cho khách khác. Hết giờ chỉ cần bấm kết nối lại nhé!</div>
  <form id="f" method="POST">
    <input type="hidden" name="username" value="guest">
    <input type="hidden" name="password" id="pw">
    <input type="hidden" name="client_mac" id="client_mac">
    <input type="hidden" name="uip" id="uip">
    <input type="hidden" name="url" id="url">
    <button type="submit">Đồng ý &amp; Kết nối WiFi</button>
  </form>
  <div id="err" class="err"></div>
  <div class="fine">Bằng việc kết nối, bạn đồng ý sử dụng WiFi đúng mục đích hợp lệ.</div>
</div>
</div>

<script>
const qs = new URLSearchParams(window.location.search);
const sip = qs.get('sip');
document.getElementById('pw').value = atob('am9sbGliZWUxMjM=');
document.getElementById('client_mac').value = qs.get('client_mac') || qs.get('mac') || '';
document.getElementById('uip').value = qs.get('uip') || '';
document.getElementById('url').value = qs.get('url') || '';

const f = document.getElementById('f');
if (sip) {
  f.action = 'https://' + sip + ':9998/login';
} else {
  document.getElementById('err').textContent = 'Không xác định được điểm truy cập WiFi — vui lòng kết nối lại mạng WiFi và thử lại.';
}
</script>
</body>
</html>
